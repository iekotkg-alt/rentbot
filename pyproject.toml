[project]
name = "rent-bot"
version = "0.1.0"
description = "Telegram bot for taxi car rental listings"
requires-python = ">=3.11"
dependencies = [
  "aiogram==3.4.1",
  "fastapi==0.110.0",
  "uvicorn==0.27.1",
  "sqlalchemy==2.0.27",
  "asyncpg==0.29.0",
  "alembic==1.13.1",
  "sqladmin==0.16.1",
  "pydantic==2.6.1",
  "pydantic-settings==2.1.0",
  "redis==5.0.1",
  "celery==5.3.6",
  "sentry-sdk==1.40.4",
  "httpx==0.26.0",
  "tenacity==8.2.3",
]

[project.optional-dependencies]
dev = [
  "pytest==7.4.4",
  "pytest-asyncio==0.23.5",
  "pytest-cov==4.1.0",
  "testcontainers[postgres,redis]==3.7.1",
  "ruff==0.2.1",
  "black==24.2.0",
]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
