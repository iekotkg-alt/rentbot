version: '3.8'

services:
  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    command: celery -A app.tasks worker -l info
    env_file: .env
    depends_on:
      - postgres
      - redis

  beat:
    build: .
    command: celery -A app.tasks beat -l info
    env_file: .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: rent
      POSTGRES_PASSWORD: rent
      POSTGRES_DB: rent
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
